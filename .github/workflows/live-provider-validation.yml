name: Live provider validation
on:
  workflow_dispatch:
    inputs:
      estimated_successful_requests:
        description: 'Confirmed Ignav successful requests already used this month.'
        required: true
        type: string
      health_only:
        description: 'Run one diagnostic health check only. Keep enabled for the first run.'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: event-grid-live-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Manual safe provider preflight
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          PYTHONPATH=src python -m flight_bridge.live_validation \
            --estimated-successful-requests "${{ inputs.estimated_successful_requests }}" \
            ${{ inputs.health_only && '--health-only' || '' }}
