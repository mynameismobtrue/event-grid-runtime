name: Live provider validation
on:
  workflow_dispatch:
    inputs:
      estimated_successful_requests:
        description: 'Conservative estimate already consumed from the one-time 1,000 successful-request free allowance.'
        required: true
        type: string
      validation_mode:
        description: 'Choose the exact validation mode.'
        required: true
        default: full_12_query_preproduction
        type: choice
        options:
          - health_only
          - full_12_query_preproduction
permissions:
  contents: read
concurrency:
  group: event-grid-live-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository target guard
        run: |
          test "$GITHUB_REPOSITORY" = "mynameismobtrue/event-grid-runtime" || { echo CROSS_REPO_WRITE_BLOCKED; exit 1; }
      - name: Static validation
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Manual safe provider preflight
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          PYTHONPATH=src python -m flight_bridge.live_validation \
            --estimated-successful-requests "${{ inputs.estimated_successful_requests }}" \
            ${{ inputs.validation_mode == 'health_only' && '--health-only' || '' }}
