name: Static safety CI
on:
  push:
    branches: [execution-graph-v3]
  pull_request:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository write-target guard
        run: |
          test "$GITHUB_REPOSITORY" = "mynameismobtrue/event-grid-runtime" || { echo CROSS_REPO_WRITE_BLOCKED; exit 1; }
      - name: Compile and regression suite
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Public secret pattern scan
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{10,}|X-Api-Key:[[:space:]]*[A-Za-z0-9._-]{10,}' -- . ':!tests' ':!.gitignore'; then
            echo 'SECRET_SCAN_FAILED'
            exit 1
          fi
      - name: Publish observable commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          test "$GITHUB_REPOSITORY" = "mynameismobtrue/event-grid-runtime" || { echo CROSS_REPO_WRITE_BLOCKED; exit 1; }
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='flight-data-bridge/static-safety-ci' \
            -f description="Static safety CI $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
